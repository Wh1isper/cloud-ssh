[package]
name = "owlmux-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Target-side reverse connection client for OwlMux"
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ssh", "terminal", "tmux", "relay"]
categories = ["command-line-utilities", "network-programming"]
publish = true

[dependencies]
base64 = "0.22.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
futures-util = "0.3.32"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rpassword = "7.4.0"
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519", "rand_core", "std"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.21.0", features = ["serde", "v4"] }
zeroize = "1.8.2"

[lints]
workspace = true
