services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: owlmux
      POSTGRES_PASSWORD: owlmux
      POSTGRES_USER: owlmux
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username owlmux --dbname owlmux"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - owlmux-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:56379:6379"

volumes:
  owlmux-postgres:
