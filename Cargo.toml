[workspace]
members = [
    "crates/owlmux-relay",
    "crates/owlmux-server",
]
resolver = "3"

[workspace.package]
version = "0.0.4"
edition = "2024"
rust-version = "1.97"
license = "BSD-3-Clause"
repository = "https://github.com/owlfoundry/owlmux"
authors = ["OwlFoundry"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
