name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: Release
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release identity
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          version="${RELEASE_TAG#v}"
          repository_version="$(python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          versions = {
              tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"],
              json.loads(Path("package.json").read_text(encoding="utf-8"))["version"],
              json.loads(Path("apps/web/package.json").read_text(encoding="utf-8"))["version"],
              json.loads(Path("docs/package.json").read_text(encoding="utf-8"))["version"],
          }
          if len(versions) != 1:
              raise SystemExit(f"repository versions disagree: {sorted(versions)}")
          print(versions.pop())
          PY
          )"
          [[ "$version" == "$repository_version" ]]
          revision="$(git rev-parse HEAD)"
          [[ "$(git rev-list --max-count=1 "$RELEASE_TAG")" == "$revision" ]]
          prerelease=false
          if [[ "$version" == 0.* || "$version" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "version=$version"
            echo "revision=$revision"
            echo "host=x86_64-unknown-linux-gnu"
            echo "image-tag=${version//+/_}"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Rust for crates.io
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Package crates.io sources
        env:
          RUSTUP_TOOLCHAIN: 1.97.1
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          cargo package --locked --no-verify --package owlmux-server --package owlmux-relay
          test -f "target/package/owlmux-server-$VERSION.crate"
          test -f "target/package/owlmux-relay-$VERSION.crate"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install --global pnpm@11.20.0
      - name: Build release Web assets
        env:
          REVISION: ${{ steps.release.outputs.revision }}
        run: |
          pnpm install --filter @owlmux/web... --frozen-lockfile
          pnpm --filter @owlmux/web build
          printf '%s\n' "$REVISION" > apps/web/dist/SOURCE_REVISION
      - name: Build portable Server and Relay binaries
        env:
          REVISION: ${{ steps.release.outputs.revision }}
        run: |
          mkdir release-target
          docker run --rm \
            --env CARGO_TARGET_DIR=/target \
            --env OWLMUX_BUILD_REVISION="$REVISION" \
            --env RUSTUP_TOOLCHAIN=1.97.1 \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/release-target:/target" \
            --workdir /workspace \
            rust:1.97.1-bullseye \
            cargo build --release --locked --package owlmux-server --package owlmux-relay
      - name: Verify binary glibc baseline
        run: |
          python3 scripts/check-glibc-baseline.py release-target/release/owlmux-server 2.35
          python3 scripts/check-glibc-baseline.py release-target/release/owlmux-relay 2.35
      - name: Package release archives
        env:
          VERSION: ${{ steps.release.outputs.version }}
          HOST: ${{ steps.release.outputs.host }}
          REVISION: ${{ steps.release.outputs.revision }}
        run: |
          mkdir -p dist/server dist/relay
          cp release-target/release/owlmux-server dist/server/
          cp release-target/release/owlmux-relay dist/relay/
          cp LICENSE dist/server/LICENSE
          cp LICENSE dist/relay/LICENSE
          cp crates/owlmux-server/README.md dist/server/README.md
          cp crates/owlmux-relay/README.md dist/relay/README.md
          cp -R apps/web/dist dist/server/web
          cp -R contracts dist/server/contracts
          cp -R crates/owlmux-server/migrations dist/server/migrations
          mkdir -p dist/relay/contracts
          cp -R contracts/relay dist/relay/contracts/relay
          printf '%s\n' "$REVISION" | tee dist/server/SOURCE_REVISION dist/relay/SOURCE_REVISION >/dev/null
          grep -qx "$REVISION" dist/server/web/SOURCE_REVISION
          tar -czf "dist/owlmux-server-${VERSION}-${HOST}.tar.gz" -C dist/server owlmux-server LICENSE README.md SOURCE_REVISION web contracts migrations
          tar -czf "dist/owlmux-relay-${VERSION}-${HOST}.tar.gz" -C dist/relay owlmux-relay LICENSE README.md SOURCE_REVISION contracts
          (
            cd dist
            sha256sum owlmux-*.tar.gz > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          tar -tzf "dist/owlmux-server-${VERSION}-${HOST}.tar.gz" > dist/server-contents.txt
          tar -tzf "dist/owlmux-relay-${VERSION}-${HOST}.tar.gz" > dist/relay-contents.txt
          grep -qx 'web/index.html' dist/server-contents.txt
          grep -qx 'migrations/0003_cluster_membership.sql' dist/server-contents.txt
          grep -qx 'contracts/relay/v1/manifest.json' dist/relay-contents.txt
          rm dist/server-contents.txt dist/relay-contents.txt
      - name: Build release Server image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ steps.release.outputs.image-tag }}
          REVISION: ${{ steps.release.outputs.revision }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          image="${IMAGE,,}"
          docker build --pull \
            --build-arg "OWLMUX_VERSION=$VERSION" \
            --build-arg "OWLMUX_BUILD_REVISION=$REVISION" \
            --build-arg "VCS_REF=$REVISION" \
            --build-arg "SOURCE_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$image:$IMAGE_TAG" \
            .
          scripts/docker/smoke-server-image.sh "$image:$IMAGE_TAG"
      - name: Publish crates.io packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RUSTUP_TOOLCHAIN: 1.97.1
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          mkdir -p "$RUNNER_TEMP/owlmux-crates"

          query_crate() {
            local package="$1"
            local response="$RUNNER_TEMP/owlmux-crates/$package.json"
            CRATE_HTTP_STATUS="$(curl \
              --silent \
              --show-error \
              --output "$response" \
              --write-out '%{http_code}' \
              --user-agent "owlmux-release/$VERSION (+$GITHUB_SERVER_URL/$GITHUB_REPOSITORY)" \
              "https://crates.io/api/v1/crates/$package/$VERSION")"
            CRATE_RESPONSE="$response"
          }

          verify_published_checksum() {
            local package="$1"
            local archive="target/package/$package-$VERSION.crate"
            local expected
            local published
            expected="$(sha256sum "$archive" | cut -d ' ' -f 1)"
            published="$(jq --exit-status --raw-output '.version.checksum' "$CRATE_RESPONSE")"
            if [[ "$published" != "$expected" ]]; then
              echo "::error::$package $VERSION exists with checksum $published, expected $expected"
              return 1
            fi
          }

          packages=(owlmux-server owlmux-relay)
          for package in "${packages[@]}"; do
            query_crate "$package"
            case "$CRATE_HTTP_STATUS" in
              200)
                verify_published_checksum "$package"
                touch "$RUNNER_TEMP/owlmux-crates/$package.published"
                ;;
              404)
                ;;
              *)
                cat "$CRATE_RESPONSE"
                echo "::error::crates.io returned HTTP $CRATE_HTTP_STATUS for $package $VERSION"
                exit 1
                ;;
            esac
          done

          for package in "${packages[@]}"; do
            if [[ -f "$RUNNER_TEMP/owlmux-crates/$package.published" ]]; then
              echo "$package $VERSION is already published with the exact release checksum"
              continue
            fi
            publish_status=0
            cargo publish \
              --locked \
              --no-verify \
              --registry crates-io \
              --package "$package" || publish_status=$?

            published=false
            for _ in {1..30}; do
              query_crate "$package"
              if [[ "$CRATE_HTTP_STATUS" == 200 ]]; then
                verify_published_checksum "$package"
                published=true
                break
              fi
              if [[ "$CRATE_HTTP_STATUS" != 404 ]]; then
                cat "$CRATE_RESPONSE"
                echo "::error::crates.io returned HTTP $CRATE_HTTP_STATUS while verifying $package $VERSION"
                exit 1
              fi
              sleep 2
            done
            if [[ "$published" != true ]]; then
              echo "::error::$package $VERSION was not visible on crates.io after cargo publish status $publish_status"
              exit 1
            fi
            if [[ "$publish_status" -ne 0 ]]; then
              echo "::warning::cargo publish exited with status $publish_status, but crates.io contains the exact package checksum"
            fi
          done
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish release Server image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ steps.release.outputs.image-tag }}
          REVISION: ${{ steps.release.outputs.revision }}
          VERSION: ${{ steps.release.outputs.version }}
        run: scripts/release/publish-server-image.sh "${IMAGE,,}:$IMAGE_TAG" "$VERSION" "$REVISION"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          scripts/release/publish-github-release.sh \
            "$RELEASE_TAG" \
            "$VERSION" \
            "$PRERELEASE" \
            dist/owlmux-server-*.tar.gz \
            dist/owlmux-relay-*.tar.gz \
            dist/SHA256SUMS
