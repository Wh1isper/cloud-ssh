name: Docs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy docs
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: docs
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out qualified revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install --global pnpm@11.20.0
      - name: Build documentation
        env:
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          pnpm install --filter @owlmux/docs... --frozen-lockfile
          pnpm --filter @owlmux/docs build
          printf '%s\n' "$REVISION" > docs/.vitepress/dist/SOURCE_REVISION
          grep -qx "$REVISION" docs/.vitepress/dist/SOURCE_REVISION
      - name: Check Cloudflare configuration
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          configured=false
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            configured=true
          else
            echo "::notice::Skipping deployment until Cloudflare environment secrets are configured"
          fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Workers
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @owlmux/docs run deploy
